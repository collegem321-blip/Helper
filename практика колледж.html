<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощник кулинара — рецепт дня</title>
<style>
  :root{
    --bg:#f6f2ea;
    --card:#fffdf8;
    --ink:#2b2620;
    --muted:#7a7066;
    --line:#e3dccf;
    --accent:#8a5a2b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header{
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 10px;
  }
  h1{
    font-size:28px;
    font-weight:600;
    margin:0 0 6px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    margin:0;
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .cover{
    width:100%;
    display:block;
    aspect-ratio:16/9;
    object-fit:cover;
    background:#eee6d8;
  }
  .body{padding:24px}
  .meta{
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  h2{
    font-size:24px;
    font-weight:600;
    margin:0 0 18px;
    line-height:1.25;
  }
  h3{
    font-size:15px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    margin:24px 0 10px;
  }
  ul,ol{margin:0;padding-left:22px}
  li{margin:6px 0}
  ol li{margin:10px 0}
  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  button{
    font:inherit;
    cursor:pointer;
    border-radius:8px;
    padding:10px 18px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    transition:opacity .15s;
  }
  button:hover{opacity:.88}
  button.secondary{
    background:transparent;
    color:var(--accent);
  }
  .status{
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
  }
  .status.error{color:#9b3a2e}
  .hidden{display:none}
  footer{
    max-width:760px;
    margin:0 auto;
    padding:0 20px 40px;
    font-size:13px;
    color:var(--muted);
  }
  @media (max-width:520px){
    h1{font-size:23px}
    h2{font-size:20px}
    .body{padding:18px}
  }
</style>
</head>
<body>

<header>
  <h1>Помощник кулинара</h1>
  <p class="sub">Рецепт дня из открытой базы TheMealDB</p>
</header>

<main>
  <div id="status" class="status">Загружаем рецепт…</div>

  <article id="card" class="card hidden">
    <img id="cover" class="cover" alt="">
    <div class="body">
      <div id="meta" class="meta"></div>
      <h2 id="title"></h2>

      <h3>Ингредиенты</h3>
      <ul id="ingredients"></ul>

      <h3>Приготовление</h3>
      <ol id="steps"></ol>

      <div class="actions">
        <button id="refresh">Другой рецепт</button>
        <a id="source" class="hidden" target="_blank" rel="noopener">
          <button class="secondary" type="button">Источник</button>
        </a>
      </div>
    </div>
  </article>
</main>

<footer>
  Данные предоставлены TheMealDB. Рецепт дня сохраняется в браузере до конца суток.
</footer>

<script>
(function () {
  var API = 'https://www.themealdb.com/api/json/v1/1/random.php';
  var CACHE_KEY = 'recipe_of_the_day';

  var statusEl = document.getElementById('status');
  var cardEl = document.getElementById('card');
  var coverEl = document.getElementById('cover');
  var metaEl = document.getElementById('meta');
  var titleEl = document.getElementById('title');
  var ingEl = document.getElementById('ingredients');
  var stepsEl = document.getElementById('steps');
  var sourceLink = document.getElementById('source');

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      return data.date === todayKey() ? data.meal : null;
    } catch (e) {
      return null;
    }
  }

  function writeCache(meal) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ date: todayKey(), meal: meal }));
    } catch (e) {}
  }

  function collectIngredients(meal) {
    var list = [];
    for (var i = 1; i <= 20; i++) {
      var name = (meal['strIngredient' + i] || '').trim();
      var measure = (meal['strMeasure' + i] || '').trim();
      if (!name) continue;
      list.push(measure ? measure + ' ' + name : name);
    }
    return list;
  }

  function splitSteps(text) {
    if (!text) return [];
    return text
      .split(/\r?\n+/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function showStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (isError ? ' error' : '');
    statusEl.classList.remove('hidden');
    cardEl.classList.add('hidden');
  }

  function render(meal) {
    statusEl.classList.add('hidden');
    cardEl.classList.remove('hidden');

    coverEl.src = meal.strMealThumb || '';
    coverEl.alt = meal.strMeal || 'Блюдо';

    var metaParts = [];
    if (meal.strCategory) metaParts.push(meal.strCategory);
    if (meal.strArea) metaParts.push(meal.strArea);
    metaEl.textContent = metaParts.join(' · ');

    titleEl.textContent = meal.strMeal || 'Без названия';

    ingEl.innerHTML = '';
    collectIngredients(meal).forEach(function (item) {
      var li = document.createElement('li');
      li.textContent = item;
      ingEl.appendChild(li);
    });

    stepsEl.innerHTML = '';
    splitSteps(meal.strInstructions).forEach(function (step) {
      var li = document.createElement('li');
      li.textContent = step;
      stepsEl.appendChild(li);
    });

    if (meal.strSource) {
      sourceLink.href = meal.strSource;
      sourceLink.classList.remove('hidden');
    } else {
      sourceLink.classList.add('hidden');
    }
  }

  function fetchRecipe() {
    showStatus('Загружаем рецепт…', false);

    fetch(API)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.meals || !data.meals.length) {
          throw new Error('Пустой ответ');
        }
        return data.meals[0];
      })
      .then(function (meal) {
        writeCache(meal);
        render(meal);
      })
      .catch(function () {
        showStatus('Не удалось загрузить рецепт. Проверьте соединение и попробуйте снова.', true);
      });
  }

  document.getElementById('refresh').addEventListener('click', fetchRecipe);

  var cached = readCache();
  if (cached) {
    render(cached);
  } else {
    fetchRecipe();
  }
})();
</script>

</body>
</html>
